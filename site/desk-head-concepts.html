<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk header designs · Path to Glory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<style>
  /* concept page only (delete once a design is picked) */
  /* the old header, for the Now comparison (no longer in app.css) */
  .id-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--badge);color:#f4f4f2;border-radius:16px;padding:20px 22px;box-shadow:var(--lift);border-left:12px solid var(--red)}
  .id-card .mono-label{color:#a5a5aa}
  .id-card h1{font:900 clamp(30px,4.4vw,50px)/.95 var(--f-display);letter-spacing:-.04em;text-transform:uppercase;margin:6px 0 4px;overflow-wrap:anywhere}
  .id-card .av-ph{background:var(--red)}
  .mono-sub{font:500 12px/1.4 var(--f-mono);color:#b3b3b8;margin:0 0 10px;letter-spacing:.06em;overflow-wrap:anywhere}
  .id-card .barcode{width:120px;height:34px;color:#f4f4f2}
  @media (max-width:640px){.id-card{grid-template-columns:auto minmax(0,1fr);padding:16px}.id-card .barcode{display:none}}
  .hx{padding:36px 0 100px}
  .hx h1.pg{font:900 clamp(30px,5vw,48px)/1 var(--f-display);text-transform:uppercase;letter-spacing:-.04em;margin:0 0 10px}
  .hx .lead{color:#cfcac0;max-width:82ch;margin:0}
  .hx-ctl{display:flex;gap:10px 24px;flex-wrap:wrap;align-items:center;margin:22px 0 0;color:#cfcac0;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
  .hx-ctl .seg{display:inline-flex;border:1.5px solid #6b655c}
  .hx-ctl .seg button,.hx-ctl .seg a{appearance:none;border:0;background:transparent;color:#e9e5dc;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:10px 12px;cursor:pointer;text-decoration:none}
  .hx-ctl .seg > * + *{border-left:1.5px solid #6b655c}
  .hx-ctl .seg [aria-pressed="true"]{background:var(--paper);color:var(--ink)}
  .hx-item{margin-top:46px}
  .hx-item > h2{font:900 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:-.03em;margin:0 0 6px}
  .hx-item > h2 span{color:var(--red)}
  .hx-item > p{color:#cfcac0;max-width:82ch;margin:0 0 14px}
  .hx-stage{display:grid;gap:18px;padding:18px;border:1px dashed #4a453f}
  .hx-stage .desk-tabs{margin:0}

  /* 1 · plain heading */
  .h1x{display:grid;gap:6px;padding-bottom:16px;border-bottom:1px solid #4a453f}
  .h1x .mono-label{color:#a5a5aa}
  .h1x h1{font:900 clamp(30px,4.4vw,46px)/.95 var(--f-display);letter-spacing:-.04em;text-transform:uppercase;margin:0;color:var(--paper)}
  .h1x p{margin:0;font:500 13px/1.4 var(--f-mono);color:#b3b3b8;letter-spacing:.04em}
  .h1x p b{color:#f4f4f2;font-weight:600}

  /* 2 · heading + at a glance */
  .h2x{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center;padding:20px 24px}
  .h2x .who{display:flex;gap:16px;align-items:center;min-width:0}
  .h2x h1{font:900 clamp(26px,3.6vw,38px)/.95 var(--f-display);letter-spacing:-.04em;text-transform:uppercase;margin:4px 0 6px;overflow-wrap:anywhere}
  .h2x .mono-label{color:var(--ink-soft)}
  .h2x .sub{margin:0;font:500 12px/1.4 var(--f-mono);color:var(--ink-soft)}
  .stats3{display:grid;grid-template-columns:repeat(3,minmax(110px,auto));gap:8px}
  .stats3 a,.stats3 div{display:grid;gap:4px;align-content:start;background:#fff;padding:10px 14px;border-top:4px solid var(--ink);color:var(--ink);text-decoration:none;min-width:0}
  .stats3 a:hover{background:#f4f1ea}
  .stats3 b{font:900 22px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
  .stats3 span{font:600 10px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .stats3 .hot{border-top-color:var(--red)}
  @media (max-width:820px){ .h2x{grid-template-columns:minmax(0,1fr)} .stats3{grid-template-columns:repeat(3,minmax(0,1fr))} }

  /* 3 · today strip */
  .h3x{display:grid;gap:0;background:var(--badge);color:#f4f4f2;box-shadow:var(--lift)}
  .h3x .top{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #34343a}
  .h3x .dy{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .h3x .dy b{font:900 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:-.02em}
  .h3x .dy span{font:500 12px/1.4 var(--f-mono);color:#b3b3b8;letter-spacing:.04em}
  .h3x .me{display:flex;gap:10px;align-items:center;font:600 14px/1.2 var(--f-type)}
  .h3x .me .av-ph{background:var(--red)}
  .h3x .next{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 20px;font:400 15px/1.45 var(--f-type)}
  .h3x .next .mono-label{color:#a5a5aa;font-size:10px}
  .h3x .next a{color:#f2b8b5}

  /* 4 · one bar with the tabs in it */
  .h4x{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 18px;align-items:center;padding:14px 18px}
  .h4x h1{font:900 24px/1 var(--f-display);letter-spacing:-.03em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
  .h4x .sub{margin:3px 0 0;font:500 12px/1.4 var(--f-mono);color:var(--ink-soft)}
  .h4x .tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .h4x .tabs button{appearance:none;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:600 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:11px 14px;cursor:pointer}
  .h4x .tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
  @media (max-width:640px){ .h4x{grid-template-columns:auto minmax(0,1fr)} .h4x .tabs{grid-column:1/-1;justify-content:flex-start} }

  /* 5 · needs you */
  .h5x{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px 28px;padding:20px 24px;align-items:start}
  .h5x h1{font:900 clamp(26px,3.6vw,38px)/.95 var(--f-display);letter-spacing:-.04em;text-transform:uppercase;margin:4px 0 6px;overflow-wrap:anywhere}
  .h5x .mono-label{color:var(--ink-soft)}
  .h5x .sub{margin:0;font:500 12px/1.4 var(--f-mono);color:var(--ink-soft)}
  .todo{list-style:none;margin:0;padding:0;border-top:1px dashed #b9b5ac}
  .todo li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px dashed #b9b5ac;font:400 15px/1.45 var(--f-type)}
  .todo li i{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);align-self:center}
  .todo li.hot i{background:var(--red)}
  .todo li.ok i{background:var(--green)}
  .todo a{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--red-deep);white-space:nowrap}
  @media (max-width:820px){ .h5x{grid-template-columns:minmax(0,1fr)} }

  /* 6 · no header: just the tabs, role on the right */
  .h6x{position:relative}
  .h6x .h6role{position:absolute;right:0;bottom:12px;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#a5a5aa}
</style>
</head>
<body>
<main class="wrap hx">
  <h1 class="pg">Desk header designs</h1>
  <p class="lead">The bar at the top of the desk, six ways, plus what's there now. None of them have the barcode. Switch who you're looking as, and the day, to see what each one shows. These use the demo data; nothing here saves.</p>
  <div class="hx-ctl">
    <span>See it as</span><div class="seg" id="as"></div>
    <span>Day</span><div class="seg" id="when"></div>
  </div>
  <div id="out"></div>
</main>

<script src="config.js"></script>
<script src="content.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
(async function () {
  const esc = UI.esc, T = iso => new Date(iso).getTime();
  const PEOPLE = [["u-staff", "Staff"], ["u-neotep", "Mentor"], ["u-jeiss", "Player"]];
  const DURING = "2026-11-12";
  const FAKE = UI.todayYmd() === DURING;
  // "now" follows the previewed day, so waiting and next-session counts match it
  const NOW = FAKE ? UI.etAt(DURING, 12 * 60).getTime() : Date.now();
  const etT = iso => new Date(iso).toLocaleTimeString("en-US", { timeZone: UI.EVENT_TZ, hour: "numeric", minute: "2-digit" });
  const dayS = iso => UI.date(UI.etAt(UI.dayOf(iso), 720), { weekday: "short", month: "short", day: "numeric" });
  const when = r => dayS(r.starts_at) + " · " + etT(r.starts_at) + " ET";
  const hrs = n => (n % 60 ? (n / 60).toFixed(1) : n / 60) + " h";

  document.getElementById("when").innerHTML =
    '<a href="?" aria-pressed="' + !FAKE + '">Today (before it starts)</a><a href="?today=' + DURING + '" aria-pressed="' + FAKE + '">Thu, Nov 12 (during)</a>';

  // the event right now: before, which day, or over
  function eventStatus() {
    const days = UI.eventDays(), today = UI.todayYmd(), i = days.findIndex(d => d.ymd === today);
    if (today < days[0].ymd) { const n = Math.round((Date.parse(days[0].ymd) - Date.parse(today)) / 864e5); return { big: "Starts " + dayS(UI.etAt(days[0].ymd, 720)), small: n === 1 ? "tomorrow" : "in " + n + " days", ev: "" }; }
    if (i < 0) return { big: "The event is over", small: "Nov 9–22", ev: "" };
    const ev = days[i].events[0];
    return { big: "Day " + (i + 1) + " of " + days.length, small: dayS(UI.etAt(today, 720)), ev: ev ? ev.title : "" };
  }

  async function facts() {
    const me = await API.session(), [coaches, teams] = await Promise.all([API.coaches(), API.teams()]);
    const coach = coaches.find(c => c.profile_id === me.id) || null;
    const team = teams.find(t => (t.member_ids || []).includes(me.id)) || null;
    const staff = me.role === "staff", player = (!coach && !staff) || !!team;
    const F = { me, coach, team, staff, player, coaches, teams, ev: eventStatus() };
    F.roles = [];
    if (coach) F.roles.push((coach.kind === "assistant" ? "Assistant " : "Mentor ") + UI.pad(coach.slot));
    if (player) F.roles.push("Player");
    if (staff) F.roles.push("Staff");
    F.tabs = [].concat(coach ? [coach.kind === "assistant" ? "Coach calendar" : "Mentor calendar"] : [], player ? ["Player file"] : [], staff ? ["Staff"] : []);
    if (staff) {
      const reqs = await API.allRequests(), hours = await API.allAvailability();
      F.waiting = reqs.filter(r => r.status === "pending" && T(r.starts_at) > NOW);
      F.booked = reqs.filter(r => r.status === "accepted" && T(r.ends_at) > NOW);
      F.noHours = coaches.filter(c => !hours.some(h => h.coach_id === c.id && T(h.ends_at) > NOW));
      F.today = reqs.filter(r => r.status === "accepted" && UI.dayOf(r.starts_at) === UI.todayYmd());
    } else if (coach) {
      const reqs = await API.coachRequests(coach.id), hours = await API.availability(coach.id);
      F.myTeam = teams.find(t => t.coach_id === coach.id) || null;
      F.waiting = reqs.filter(r => r.status === "pending" && T(r.starts_at) > NOW);
      F.next = reqs.filter(r => r.status === "accepted" && T(r.ends_at) > NOW).sort((a, b) => T(a.starts_at) - T(b.starts_at))[0] || null;
      F.hours = hours.filter(h => T(h.ends_at) > NOW).reduce((n, h) => n + (T(h.ends_at) - Math.max(T(h.starts_at), NOW)) / 6e4, 0);
      F.hours = Math.round(F.hours / 30) * 30;
    }
    if (player) {
      const mine = await API.myRequests();
      F.myCoach = team && coaches.find(c => c.id === team.coach_id);
      F.myWaiting = mine.filter(r => r.status === "pending" && T(r.starts_at) > NOW);
      F.myNext = mine.filter(r => r.status === "accepted" && T(r.ends_at) > NOW).sort((a, b) => T(a.starts_at) - T(b.starts_at))[0] || null;
    }
    return F;
  }

  const tabsRow = F => '<div class="desk-tabs">' + F.tabs.map((t, i) => '<button type="button" class="dtab" aria-selected="' + !i + '">' + esc(t) + "</button>").join("") + "</div>";
  const name = F => esc(UI.who(F.me));
  const roleLine = F => F.roles.join(" · ");
  const coachLabel = c => esc(UI.bare(UI.coachName(c)));

  // what matters most to each person, in one line each
  function stat3(F) {
    if (F.staff) return [
      [F.waiting.length, F.waiting.length === 1 ? "Request waiting" : "Requests waiting", F.waiting.length > 0],
      [F.booked.length, "Sessions booked"],
      [F.noHours.length, F.noHours.length === 1 ? "Coach with no hours" : "Coaches with no hours", F.noHours.length > 0]];
    if (F.coach) return [
      [F.waiting.length, F.waiting.length === 1 ? "Request waiting" : "Requests waiting", F.waiting.length > 0],
      [F.next ? dayS(F.next.starts_at).split(",")[0] + " " + etT(F.next.starts_at) : "None", "Next session"],
      [hrs(F.hours), "Hours posted"]];
    return [
      [F.team ? esc(F.team.name) : "No team", "Your team"],
      [F.myNext ? dayS(F.myNext.starts_at).split(",")[0] + " " + etT(F.myNext.starts_at) : "None", "Next session"],
      [F.myWaiting.length, F.myWaiting.length === 1 ? "Request waiting" : "Requests waiting", F.myWaiting.length > 0]];
  }
  function nextLine(F) {
    if (F.staff) return F.today.length ? F.today.length + (F.today.length === 1 ? " session" : " sessions") + " today" : F.waiting.length + " requests waiting across all coaches";
    if (F.coach) return F.next ? (F.next.kind === "team" ? "Team review" : "Individual session") + " with " + esc(UI.who(F.next.requester)) + ", " + when(F.next) : "No sessions booked yet";
    return F.myNext ? (F.myNext.kind === "team" ? "Team review" : "Individual session") + " with " + coachLabel(F.myNext.coach) + ", " + when(F.myNext) : "No sessions booked yet";
  }
  function todo(F) {
    const L = [];
    if (F.staff) {
      L.push([F.waiting.length ? "hot" : "ok", F.waiting.length ? F.waiting.length + " requests are waiting for a coach's answer" : "No requests waiting", F.waiting.length ? "Requests" : ""]);
      L.push([F.noHours.length ? "hot" : "ok", F.noHours.length ? F.noHours.map(c => esc(UI.bare(UI.coachName(c)))).slice(0, 3).join(", ") + (F.noHours.length > 3 ? " and " + (F.noHours.length - 3) + " more" : "") + (F.noHours.length === 1 ? " hasn't" : " haven't") + " posted hours" : "Every coach has hours posted", F.noHours.length ? "Hours" : ""]);
      L.push(["", F.booked.length + " sessions booked from here on", "Requests"]);
    } else if (F.coach) {
      L.push([F.waiting.length ? "hot" : "ok", F.waiting.length ? F.waiting.length + (F.waiting.length === 1 ? " request is" : " requests are") + " waiting for your answer" : "No requests waiting", F.waiting.length ? "Answer" : ""]);
      L.push(["", F.next ? "Next session: " + nextLine(F) : "No sessions booked yet", F.next ? "Calendar" : ""]);
      L.push([F.hours ? "" : "hot", F.hours ? hrs(F.hours) + " of hours posted from here on" : "You haven't posted any hours yet", "Hours"]);
    }
    if (F.player && !F.coach && !F.staff) {
      L.push(["", F.team ? "Team " + esc(F.team.name) + (F.myCoach ? ", mentor " + coachLabel(F.myCoach) : "") : "You're not on a team", ""]);
      L.push(["", F.myNext ? "Next session: " + nextLine(F) : "No sessions booked yet", ""]);
      L.push([F.myWaiting.length ? "hot" : "ok", F.myWaiting.length ? F.myWaiting.length + (F.myWaiting.length === 1 ? " request is" : " requests are") + " waiting for an answer" : "Nothing waiting", F.myWaiting.length ? "Requests" : "Request one"]);
    }
    return L;
  }

  function render(F) {
    const s = stat3(F), td = todo(F), E = F.ev;
    const items = [
      ["Now", "What's on the desk today: the dark ID card with the barcode, the mono \"Your desk · ID // 2026\" label and the badge styling from the home page.",
        '<div class="id-card">' + UI.avatar(F.me, 64) + '<div><span class="mono-label">Your desk · ID // 2026</span><h1>' + name(F) + '</h1><p class="mono-sub">@' + esc(F.me.username || "") + (F.coach ? " · " + esc(F.coach.badge_id) : "") + '</p><div class="rchips">' + F.roles.map(r => '<span class="rchip' + (r === "Staff" ? " red" : r === "Player" ? "" : " green") + '">' + esc(r) + "</span>").join("") + "</div></div>" + UI.barcode(F.me.id, 120, 34) + "</div>" + tabsRow(F)],
      ["1", "Plain heading", "Just a page title: whose desk this is and their role, then the tabs. Nothing to read past that.",
        '<header class="h1x"><span class="mono-label">Your desk</span><h1>' + name(F) + "</h1><p>@" + esc(F.me.username || "") + " · <b>" + esc(roleLine(F)) + "</b></p></header>" + tabsRow(F)],
      ["2", "Heading + at a glance", "Your name on the left, and the three numbers that matter for your role on the right (they jump to that part of the desk).",
        '<header class="sheet h2x"><div class="who">' + UI.avatar(F.me, 52) + '<div><span class="mono-label">Your desk · ' + esc(roleLine(F)) + "</span><h1>" + name(F) + '</h1><p class="sub">@' + esc(F.me.username || "") + '</p></div></div><div class="stats3">' +
          s.map(x => '<a href="#"' + (x[2] ? ' class="hot"' : "") + "><b>" + x[0] + "</b><span>" + x[1] + "</span></a>").join("") + "</div></header>" + tabsRow(F)],
      ["3", "Today strip", "Where the event is today, who you are (small, on the right) and the next thing on your calendar.",
        '<header class="h3x"><div class="top"><div class="dy"><b>' + esc(E.big) + "</b><span>" + esc(E.small) + (E.ev ? " · " + esc(E.ev) : "") + '</span></div><div class="me">' + UI.avatar(F.me, 30) + "<span>" + name(F) + ' <span class="rchip' + (F.staff ? " red" : F.coach ? " green" : "") + '">' + esc(F.roles[0]) + "</span></span></div></div>" +
          '<div class="next"><span class="mono-label">' + (F.staff ? "Today" : "Next") + "</span><span>" + nextLine(F) + "</span></div></header>" + tabsRow(F)],
      ["4", "One bar with the tabs", "The header and the tabs become one bar, so the desk starts straight away with the work.",
        '<header class="sheet h4x">' + UI.avatar(F.me, 44) + '<div><h1>' + name(F) + '</h1><p class="sub">@' + esc(F.me.username || "") + " · " + esc(roleLine(F)) + '</p></div><div class="tabs" role="tablist">' + F.tabs.map((t, i) => '<button type="button" role="tab" aria-selected="' + !i + '">' + esc(t) + "</button>").join("") + "</div></header>"],
      ["5", "Needs you", "Your name, and a short list of what needs you right now, each with a link to the part of the desk that handles it.",
        '<header class="sheet h5x"><div><span class="mono-label">Your desk · ' + esc(roleLine(F)) + "</span><h1>" + name(F) + '</h1><p class="sub">@' + esc(F.me.username || "") + " · " + esc(E.big) + ", " + esc(E.small) + '</p></div><ul class="todo">' +
          td.map(x => '<li class="' + x[0] + '"><i></i><span>' + x[1] + "</span>" + (x[2] ? '<a href="#">' + esc(x[2]) + " ›</a>" : "<span></span>") + "</li>").join("") + "</ul></header>" + tabsRow(F)],
      ["6", "No header", "The red bar at the very top already shows your name and Log out, so the desk skips the card and starts with the tabs. Your role sits on the right of the tab row.",
        '<div class="h6x">' + tabsRow(F) + '<span class="h6role">' + esc(roleLine(F)) + "</span></div>"]
    ];
    document.getElementById("out").innerHTML = items.map(it => {
      const [k, t, p, html] = it.length === 3 ? [it[0], "What you have now", it[1], it[2]] : it;
      return '<section class="hx-item"><h2>' + (k === "Now" ? "<span>Now</span> · " : "<span>" + k + "</span> · ") + esc(t) + "</h2><p>" + esc(p) + '</p><div class="hx-stage">' + html + "</div></section>";
    }).join("");
  }

  async function show(id) {
    API.demo.setMe(id);
    await new Promise(r => setTimeout(r, 120));
    document.getElementById("as").innerHTML = PEOPLE.map(([pid, l]) => '<button type="button" data-as="' + pid + '" aria-pressed="' + (pid === id) + '">' + l + "</button>").join("");
    render(await facts());
  }
  document.getElementById("as").addEventListener("click", e => { const b = e.target.closest("[data-as]"); if (b) show(b.dataset.as); });
  document.getElementById("out").addEventListener("click", e => { if (e.target.closest('a[href="#"]')) e.preventDefault(); });
  show(PEOPLE.some(p => p[0] === API.demo.who()) ? API.demo.who() : "u-neotep");
})();
</script>
</body>
</html>
